<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8F0; --panel:#FFFFFF; --ink:#14231B; --muted:#56685D; --line:#D5E0CC;
  --deep:#17331F; --deep2:#21452C; --kernel:#6E9B3B; --lime:#CDEB8B; --hull:#B8325A;
  --display:"Fraunces",Georgia,serif; --body:"Inter","Vazirmatn",system-ui,sans-serif;
}
html[lang=fa],html[lang=ar]{--display:"Vazirmatn",system-ui,sans-serif;--body:"Vazirmatn","Inter",system-ui,sans-serif}
html[lang=zh]{--display:"Fraunces","Noto Serif SC",serif;--body:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* nav */
nav{position:sticky;top:0;z-index:30;background:rgba(245,248,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--display);font-weight:800;font-size:18px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.links{display:flex;gap:18px;margin-inline-start:auto;font-size:14px;font-weight:500}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
select.lang{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;color:var(--ink)}
@media (max-width:640px){.links{display:none}.nav-in select.lang{margin-inline-start:auto}}

/* hero */
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden}
.hero-in{max-width:1040px;margin:0 auto;padding:56px 18px 64px;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}
.eyebrow{display:inline-block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);border:1px solid rgba(205,235,139,.4);border-radius:999px;padding:3px 12px;margin-bottom:16px}
html[lang=fa] .eyebrow,html[lang=ar] .eyebrow{letter-spacing:0;text-transform:none}
h1{font-family:var(--display);font-size:clamp(32px,6vw,54px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
.hero p{margin-top:16px;color:#C6D8CB;font-size:17px;max-width:540px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{font:inherit;font-weight:600;font-size:15.5px;text-decoration:none;border-radius:10px;padding:13px 22px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:46px}
.btn.primary{background:var(--lime);color:var(--deep)}
.btn.primary:hover{background:#DCF3A8}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.wa{background:#1FA855;color:#fff}
.btn.dark{background:var(--deep);color:#fff}
.btn.line{background:transparent;color:var(--deep);border:1.5px solid var(--deep)}
.art{justify-self:center;width:min(260px,60vw);opacity:.95}
@media (max-width:760px){.hero-in{grid-template-columns:1fr;padding:40px 18px 46px}.art{display:none}}

section{padding:56px 0}
h2{font-family:var(--display);font-size:clamp(25px,4vw,34px);line-height:1.2;font-weight:800}
.lead{color:var(--muted);margin-top:8px;max-width:620px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:17px;font-weight:600;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px}
.card .num{font-family:var(--display);font-weight:800;color:var(--hull);font-size:26px;line-height:1;margin-bottom:10px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}

.vals{margin-top:-30px;position:relative;z-index:2}
.vals .cards{margin-top:0}

.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:26px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.prod .dot{width:38px;height:38px}
.prod h3{font-family:var(--display);font-size:20px;font-weight:800}
.prod .alt{font-size:12.5px;color:var(--muted)}
.prod p{font-size:14.5px;color:var(--muted);flex:1}
.prod button{margin-top:6px;font:inherit;font-size:14px;font-weight:600;color:var(--deep);background:transparent;border:1.5px solid var(--kernel);border-radius:8px;padding:8px;cursor:pointer}
.prod button:hover{background:var(--lime)}
.specs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{font-size:13px;background:#E8F0DE;border-radius:999px;padding:4px 12px;color:var(--deep)}

/* estimator */
.est{background:var(--deep);color:#fff;border-radius:18px;padding:28px;margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.est label{font-size:13px;color:#B9CDBE;display:block;margin-bottom:3px}
.est .fld{margin-bottom:12px}
.est input,.est select{font:inherit;font-size:16px;width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:10px 12px;min-height:44px}
.est select option{color:#14231B}
.est .out .k{color:#B9CDBE;font-size:13px}
.est .out .big{font-family:var(--display);font-size:clamp(34px,6vw,46px);font-weight:800;color:var(--lime);line-height:1.1;direction:ltr;text-align:start}
.est .out .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.est .out .row b{direction:ltr}
.est .fine{font-size:12.5px;color:#9FB8A6;margin-top:10px}
@media (max-width:760px){.est{grid-template-columns:1fr;padding:20px}}

/* form */
.formbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;margin-top:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld.full{grid-column:1/-1}
.formbox label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.formbox input,.formbox select,.formbox textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink);min-height:44px}
.formbox textarea{min-height:90px;resize:vertical}
.formbox input:focus,.formbox select:focus,.formbox textarea:focus{outline:2px solid var(--kernel);outline-offset:1px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.err{color:var(--hull);font-size:14px;margin-top:10px;min-height:20px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.formbox{padding:18px}}

.mk{background:#E8F0DE;border-radius:14px;padding:22px;margin-top:0;text-align:center}
.mk b{font-family:var(--display);font-size:20px}
.mk div{color:var(--muted);margin-top:4px}
footer{background:var(--deep);color:#B9CDBE;padding:28px 0 90px;font-size:14px;text-align:center}
footer a{color:var(--lime)}
.certs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.certs span{border:1px solid rgba(205,235,139,.4);color:var(--lime);border-radius:8px;padding:3px 12px;font-size:13px}

.fab{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:40;background:#1FA855;color:#fff;border-radius:999px;padding:13px 20px;font-weight:600;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

let lang='en';

const pname=p=>p[lang]||p.en;

function applyLang(l){
  lang=T[l]?l:'en';
  const rtl=(lang==='fa'||lang==='ar');
  document.documentElement.lang=lang;
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $('lang').value=lang;

  /* product cards */
  $('prods').innerHTML=PRODUCTS.map(p=>`<div class="prod">
    <svg class="dot" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="12" ry="17" fill="#E9D9C0" transform="rotate(-20 20 20)"/><ellipse cx="20" cy="20" rx="7.5" ry="12.5" fill="${p.color}" transform="rotate(-20 20 20)"/></svg>
    <h3>${p.en}</h3>${lang!=='en'&&p[lang]?`<div class="alt">${p[lang]}</div>`:''}
    <p>${t('d_'+p.k)}</p>
    <button type="button" data-k="${p.k}">${t('ask')}</button></div>`).join('');
  document.querySelectorAll('.prod button').forEach(b=>b.onclick=()=>{ $('qType').value=b.dataset.k; $('eType').value=b.dataset.k; location.hash='#quote'; estimate(); });

  $('specs').innerHTML=['sp1','sp2','sp3','sp4','sp5','sp6'].map(k=>`<span class="tag">${t(k)}</span>`).join('');

  /* selects keep their values */
  ['eType','qType'].forEach(id=>{const v=$(id).value;$(id).innerHTML=PRODUCTS.map(p=>`<option value="${p.k}">${p.en}${lang!=='en'&&p[lang]?' — '+p[lang]:''}</option>`).join('');if(v)$(id).value=v;});

  $('foot').textContent='© '+new Date().getFullYear()+' '+CONFIG.company+'. '+t('rights');
  estimate();
}

function estimate(){
  const rate=Math.max(CONFIG.usdRate,1), kg=Math.max(parseFloat($('eQty').value)||0,0)*1000;
  const base=CONFIG.basePriceToman[$('eType').value]||0;
  const usdKg=base*SIZE[$('eSize').value]/rate*(1+CONFIG.marginPct/100)+CONFIG.fobCostUsdPerKg;
  const f=(n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  $('eKg').textContent='USD '+f(usdKg);
  $('eMt').textContent='USD '+f(usdKg*1000,0);
  $('eTot').textContent='USD '+f(usdKg*kg,0);
  $('portLbl').textContent='FOB '+CONFIG.originPort;
}

function buildMessage(){
  const g=id=>$(id).value.trim();
  const p=PRODUCTS.find(x=>x.k===g('qType'));
  return `New pistachio inquiry\n`+
   `Name: ${g('qName')}\nCompany: ${g('qCompany')}\nCountry: ${g('qCountry')}\n`+
   `Email: ${g('qEmail')}\nPhone/WhatsApp: ${g('qPhone')}\n`+
   `Product: ${p.en} (${g('qForm')}), size ${g('qSize')}\n`+
   `Quantity: ${g('qQty')} MT\nIncoterm: ${g('qTerm')}${g('qDest')?' '+g('qDest'):''}\n`+
   (g('qMsg')?`Message: ${g('qMsg')}\n`:'')+`(Sent from website, language: ${lang})`;
}
function validate(){
  const ok=$('qName').value.trim()&&($('qEmail').value.trim()||$('qPhone').value.trim());
  $('err').textContent=ok?'':t('req');
  return !!ok;
}
$('sendWa').onclick=()=>{ if(!validate())return; window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(buildMessage()),'_blank'); };
$('sendMail').onclick=()=>{ if(!validate())return; location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent('Pistachio inquiry — '+($('qCompany').value.trim()||$('qName').value.trim()))+'&body='+encodeURIComponent(buildMessage()); };

/* init */
$('logo').textContent=CONFIG.company;
document.title=CONFIG.company+' — Premium Iranian Pistachios';
const wa='https://wa.me/'+CONFIG.whatsapp;
$('heroWa').href=wa; $('fab').href=wa;
$('eyebrow').textContent='Iran · Export';
Object.keys(SIZE).forEach(s=>{[$('eSize'),$('qSize')].forEach(sel=>{const o=document.createElement('option');o.value=o.textContent=s;if(s==='24/26')o.selected=true;sel.appendChild(o)})});
COUNTRIES.forEach(c=>{const o=document.createElement('option');o.value=c;$('countries').appendChild(o)});
['eType','eSize','eQty'].forEach(id=>{$(id).addEventListener('input',estimate);$(id).addEventListener('change',estimate)});
$('qSize').addEventListener('change',()=>{$('eSize').value=$('qSize').value;estimate()});
$('qQty').addEventListener('input',()=>{$('eQty').value=$('qQty').value;estimate()});
$('eQty').addEventListener('input',()=>{$('qQty').value=$('eQty').value});

if(!CONFIG.showPrices){ $('pricing').style.display='none'; $('navPrice').style.display='none'; }
if(CONFIG.certifications.length){ $('certs').innerHTML=CONFIG.certifications.map(c=>`<span>${c}</span>`).join(''); }
$('contactLine').innerHTML=
  `<div style="margin-bottom:6px">${CONFIG.broker}</div>`+
  `<div dir="ltr" style="display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center">`+
  `<a href="mailto:${CONFIG.email}">${CONFIG.email}</a>`+
  `<a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">${CONFIG.phoneDisplay}</a>`+
  `<a href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener">@${CONFIG.telegram}</a>`+
  `<a href="${CONFIG.website}" target="_blank" rel="noopener">Website</a></div>`;
$('lang').addEventListener('change',e=>applyLang(e.target.value));

const nav=(navigator.language||'en').slice(0,2).toLowerCase();
applyLang(T[nav]?nav:'en');
</script>
</body>
</html>
