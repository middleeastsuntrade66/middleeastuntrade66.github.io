<!doctype html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Middle East Sun | Global Trade</title>
<meta name="description" content="Middle East Sun | Global Trade — trade brokerage, Iranian pistachio export price calculator, buyer inquiry and proforma invoice.">
<meta property="og:title" content="Middle East Sun | Global Trade">
<meta property="og:description" content="Trade brokerage and Iranian pistachio export tools: price calculator, market prices, inquiry and proforma invoice.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#10243e;--teal:#176b73;--gold:#d99b24;--bg:#F3F6F9;--panel:#fff;--ink:#172033;--muted:#5A6A7E;--line:#DCE4EC;--hull:#B8325A;--ok:#2E6B2E}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Vazirmatn",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:15px}
button{font-family:inherit}
/* header */
header{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:34px 16px 28px;text-align:center;position:relative}
.langbar{position:absolute;top:12px;inset-inline-end:14px;display:flex;gap:6px}
.langbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 11px;font-size:13px;cursor:pointer;font-weight:700}
.langbar button.active{background:var(--gold);border-color:var(--gold)}
.logo{font-size:40px;line-height:1.2}
.brand{font-size:24px;font-weight:800;direction:ltr}
.tag{opacity:.9;font-size:15px}
/* tabs */
nav{background:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px #0001;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
nav .in{display:inline-flex;gap:4px;padding:8px 10px;min-width:100%;justify-content:center}
nav button{background:transparent;border:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer}
nav button.on{background:var(--navy);color:#fff}
#rateBar{background:#FFF8E6;border-bottom:1px solid #F0DDA8;padding:8px 12px;display:none}
#rateBar .in{max-width:1050px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#rateBar label{font-size:13px;font-weight:700}
#rateBar input{width:130px}
.chip{border:1px solid var(--gold);background:#fff;border-radius:999px;padding:2px 12px;font-size:12.5px;cursor:pointer;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip:active{background:#FBEBC4}
.container{max-width:1050px;margin:auto;padding:18px 14px 90px}
.view{display:none}.view.on{display:block}
.card,.hero{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0000000a}
.hero{text-align:center;padding:30px 20px}
.hero h1{font-size:26px;line-height:1.5;margin-bottom:8px}
.hero p{color:var(--muted);max-width:640px;margin:0 auto}
h2{font-size:20px;margin:18px 0 8px}
h3{font-size:16px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;margin:5px;font-weight:700;border:none;cursor:pointer;font-size:15px;min-height:44px}
.btn.navy{background:var(--navy)}.btn.wa{background:#1FA855}.btn.tg{background:#229ED9}.btn.line{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.icon{font-size:28px}
.tool{cursor:pointer;border:1.5px solid transparent;transition:border-color .15s}
.tool:hover{border-color:var(--gold)}
.tool p{color:var(--muted);font-size:14px}
ul{padding-inline-start:22px}
/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
label{font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input.num,input.ltr{direction:ltr;text-align:start}
html[dir=rtl] input.num{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
.hint{font-size:12px;color:var(--muted)}
.note{background:#FFF3D6;color:#8A5A00;border-radius:9px;padding:8px 12px;font-size:13px;margin:8px 0}
.sec{font-weight:800;color:var(--teal);margin:14px 0 4px}
.crow{grid-column:1/-1;display:grid;grid-template-columns:1fr 100px 124px;gap:6px;align-items:end}
.crow .lb{font-size:13.5px;padding-bottom:9px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.crow{grid-template-columns:1fr 84px 112px}}
/* results */
.res{background:var(--navy);color:#fff;border-radius:14px;padding:16px;margin-top:10px}
.res .lab{color:#B7C7D9;font-size:13px}
.res .price{font-size:36px;font-weight:800;color:#F3CE7A;direction:ltr;text-align:start;line-height:1.3}
html[dir=rtl] .res .price{text-align:right}
.res .row2{display:flex;flex-wrap:wrap;gap:6px 18px;direction:ltr;font-size:14px}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-weight:700;direction:ltr;text-align:start}
html[dir=rtl] .kv .v,html[dir=rtl] .kv .v2{text-align:right}
.kv .v2{font-size:12px;color:var(--muted);direction:ltr}
.kv.acc .v{color:var(--hull)}
.terms{display:grid;gap:8px;margin-top:8px}
.term{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.term.on{border-color:var(--teal);background:#EAF6F6}
.term b.n{direction:ltr;font-size:16px}
.term .p{direction:ltr;text-align:end;line-height:1.4}
.term .p b{color:var(--hull);font-size:16px}
.term .p small{display:block;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n{direction:ltr;text-align:end;white-space:nowrap}
td.n b{color:var(--hull)}td.n small{display:block;color:var(--muted);font-size:11.5px}
.type{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.type h3{background:var(--navy);color:#fff;padding:9px 14px;margin:0;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0}
summary{cursor:pointer;padding:12px 14px;font-weight:700}
details .fgrid{padding:0 14px 14px}
/* invoice */
#invPrint{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px;margin-top:14px;direction:ltr;text-align:left;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;line-height:1.55;color:#111}
#invPrint h1{font-size:22px;margin-bottom:2px}
#invPrint .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}
#invPrint table{margin-top:10px}
#invPrint th{background:#EEF2F6;color:#111;font-size:12.5px;font-weight:700}
#invPrint td.r,#invPrint th.r{text-align:right}
#invPrint .tot td{font-weight:700;border-top:2px solid #111}
#invPrint .sm{font-size:12px;color:#444;margin-top:12px;white-space:pre-line}
/* chat */
#chatToggle{position:fixed;bottom:18px;inset-inline-end:18px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 6px 18px #0004;z-index:50}
#chatBox{position:fixed;bottom:86px;inset-inline-end:18px;width:330px;max-width:calc(100vw - 28px);max-height:72vh;background:#fff;border-radius:16px;box-shadow:0 10px 30px #0003;display:none;flex-direction:column;overflow:hidden;z-index:50}
#chatBox.open{display:flex}
#chatHead{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:11px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#chatHead button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.85}
#chatMsgs{flex:1;overflow-y:auto;padding:12px;background:#F7F9FC;font-size:14px;min-height:160px}
.msg{margin:8px 0;padding:9px 12px;border-radius:12px;max-width:88%;line-height:1.7}
.msg.bot{background:#EAF0F6}
.msg.user{background:var(--gold);color:#fff;margin-inline-start:auto}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.acts button{font-size:12.5px;background:#fff;border:1px solid var(--teal);color:var(--teal);border-radius:12px;padding:3px 10px;cursor:pointer}
#chatQuick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid #eee}
#chatQuick button{font-size:12px;background:#EAF0F6;border:1px solid #dde3ea;border-radius:14px;padding:4px 10px;cursor:pointer}
#chatRow{display:flex;border-top:1px solid #eee;padding:8px;gap:6px}
#chatRow button{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:0 14px;cursor:pointer;font-weight:700}
footer{background:var(--navy);color:#fff;text-align:center;padding:26px 14px;font-size:13px}
footer a{color:#F3CE7A}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
#toast.on{opacity:1}
@media print{
  body *{visibility:hidden}
  #invPrint,#invPrint *{visibility:visible}
  #invPrint{position:absolute;inset:0;margin:0;border:none;border-radius:0;padding:14mm}
}
</style>
</head>
<body>

<header>
  <div class="langbar" role="group" aria-label="Language">
    <button data-lang="fa" class="active">FA</button>
    <button data-lang="en">EN</button>
    <button data-lang="ar">AR</button>
  </div>
  <div class="logo">☀️</div>
  <div class="brand">Middle East Sun | Global Trade</div>
  <div class="tag" data-i18n="tag"></div>
</header>

<nav aria-label="Main"><div class="in" id="tabs">
  <button data-view="home" data-i18n="nav_home"></button>
  <button data-view="calc" data-i18n="nav_calc"></button>
  <button data-view="prices" data-i18n="nav_prices"></button>
  <button data-view="rfq" data-i18n="nav_rfq"></button>
  <button data-view="invoice" data-i18n="nav_invoice"></button>
  <button data-view="contact" data-i18n="nav_contact"></button>
</div></nav>

<div id="rateBar"><div class="in">
  <label for="rate" data-i18n="rate_lbl"></label>
  <input id="rate" class="num" inputmode="decimal" value="267000">
  <span class="chip" data-rate="263000">263,000</span>
  <span class="chip" data-rate="267000">267,000</span>
  <span class="chip" data-rate="268820">268,820</span>
  <span class="hint" data-i18n="rate_date"></span>
</div></div>

<main class="container">

<!-- HOME -->
<section class="view" id="v-home">
  <div class="hero">
    <h1 data-i18n="hero_h1"></h1>
    <p data-i18n="hero_p"></p>
    <div style="margin-top:14px">
      <button class="btn" data-go="calc" data-i18n="hero_b1"></button>
      <button class="btn navy" data-go="rfq" data-i18n="hero_b2"></button>
    </div>
  </div>

  <h2 data-i18n="tools_h2"></h2>
  <div class="grid">
    <div class="card tool" data-go="calc"><div class="icon">🧮</div><h3 data-i18n="t1h"></h3><p data-i18n="t1p"></p></div>
    <div class="card tool" data-go="prices"><div class="icon">📊</div><h3 data-i18n="t2h"></h3><p data-i18n="t2p"></p></div>
    <div class="card tool" data-go="rfq"><div class="icon">📨</div><h3 data-i18n="t3h"></h3><p data-i18n="t3p"></p></div>
    <div class="card tool" data-go="invoice"><div class="icon">🧾</div><h3 data-i18n="t4h"></h3><p data-i18n="t4p"></p></div>
  </div>

  <div class="card"><h2 style="margin-top:0" data-i18n="about_h2"></h2><p data-i18n="about_p"></p></div>

  <h2 data-i18n="services_h2"></h2>
  <div class="grid">
    <div class="card"><div class="icon">🤝</div><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
    <div class="card"><div class="icon">🌐</div><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>
    <div class="card"><div class="icon">📦</div><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
    <div class="card"><div class="icon">📈</div><h3 data-i18n="s4h"></h3><p data-i18n="s4p"></p></div>
  </div>

  <h2 data-i18n="fields_h2"></h2>
  <div class="grid">
    <div class="card" data-i18n="f1"></div><div class="card" data-i18n="f2"></div><div class="card" data-i18n="f3"></div>
    <div class="card" data-i18n="f4"></div><div class="card" data-i18n="f5"></div><div class="card" data-i18n="f6"></div>
  </div>

  <div class="card"><h2 style="margin-top:0" data-i18n="info_h2"></h2>
    <ul><li data-i18n="i1"></li><li data-i18n="i2"></li><li data-i18n="i3"></li><li data-i18n="i4"></li><li data-i18n="i5"></li></ul>
  </div>
</section>

<!-- CALCULATOR -->
<section class="view" id="v-calc">
  <h2 data-i18n="calc_h2"></h2>
  <div class="note" data-i18n="calc_note"></div>

  <div class="card">
    <div class="sec" data-i18n="sec_product"></div>
    <div class="fgrid">
      <div class="f"><label for="cType" data-i18n="l_type"></label><select id="cType"></select></div>
      <div class="f"><label for="cSize" data-i18n="l_size"></label><select id="cSize"></select></div>
      <div class="f"><label for="cGrade" data-i18n="l_grade"></label><input id="cGrade" value="1" autocomplete="off"></div>
      <div class="f"><label for="cForm" data-i18n="l_form"></label>
        <select id="cForm"><option value="raw" data-i18n="form_raw"></option><option value="salt" data-i18n="form_salt"></option><option value="roast" data-i18n="form_roast"></option></select></div>
    </div>

    <div class="sec" data-i18n="sec_deal"></div>
    <div class="fgrid">
      <div class="f"><label for="cQty" data-i18n="l_qty"></label><input id="cQty" class="num" inputmode="decimal" value="19"></div>
      <div class="f"><label for="cQU">&nbsp;</label><select id="cQU"><option value="ton" data-i18n="u_ton"></option><option value="kg" data-i18n="u_kg"></option></select></div>
      <div class="f"><label for="cPrice" data-i18n="l_price"></label><input id="cPrice" class="num" inputmode="decimal"></div>
      <div class="f"><label for="cPU">&nbsp;</label><select id="cPU"><option value="tmn" data-i18n="pu_tmn"></option><option value="usd" data-i18n="pu_usd"></option></select></div>
      <div class="f full"><span class="hint" id="cRefHint"></span><div class="chips"><button type="button" class="chip" id="cApplyRef" data-i18n="btn_ref"></button></div></div>
      <div class="f"><label for="cAdj" data-i18n="l_adj"></label><input id="cAdj" class="num" inputmode="decimal" value="0"></div>
      <div class="f"><label for="cComm" data-i18n="l_comm"></label><input id="cComm" class="num" inputmode="decimal" value="2"></div>
      <div class="f full"><label for="cProfit" data-i18n="l_profit"></label><input id="cProfit" class="num" inputmode="decimal" value="5"></div>
    </div>

    <div class="sec" data-i18n="sec_costs"></div>
    <div class="fgrid" id="costRows"></div>

    <div class="sec" data-i18n="sec_terms"></div>
    <div class="fgrid">
      <div class="f"><label for="cTerm" data-i18n="l_term"></label>
        <select id="cTerm"><option>EXW</option><option>FOB</option><option>CFR</option><option selected>CIF</option></select></div>
      <div class="f"><label for="cDest" data-i18n="l_dest"></label><input id="cDest" class="ltr" value="Mersin, Turkey"></div>
      <div class="f"><label for="cPay" data-i18n="l_pay"></label>
        <select id="cPay"><option value="TT">T/T</option><option value="LC">L/C</option><option value="OTH" data-i18n="pay_other"></option></select></div>
      <div class="f"><label for="cPayfee" data-i18n="l_payfee"></label><input id="cPayfee" class="num" inputmode="decimal" value="0"></div>
    </div>
  </div>

  <h2 data-i18n="sec_results"></h2>
  <div id="cRes"></div>
  <div style="margin-top:10px">
    <button class="btn" id="cToInv" type="button" data-i18n="btn_invoice"></button>
    <button class="btn line" id="cCopy" type="button" data-i18n="btn_copy"></button>
  </div>
</section>

<!-- PRICES -->
<section class="view" id="v-prices">
  <h2 data-i18n="prices_h2"></h2>
  <div class="note" data-i18n="prices_note"></div>
  <div class="card">
    <div class="f"><label data-i18n="l_form"></label><div class="chips" id="pForms"></div></div>
    <div class="f" style="margin-top:10px"><label data-i18n="p_unit"></label><div class="chips" id="pUnits"></div></div>
    <div class="f" style="margin-top:10px"><label for="pGrade" data-i18n="l_grade"></label><input id="pGrade" value="1" autocomplete="off"></div>
  </div>
  <div id="pBoard"></div>
  <details><summary data-i18n="p_settings"></summary><div class="fgrid" id="pBase"></div></details>
</section>

<!-- RFQ -->
<section class="view" id="v-rfq">
  <h2 data-i18n="rfq_h2"></h2>
  <p class="hint" data-i18n="rfq_p"></p>
  <div class="card"><div class="fgrid">
    <div class="f"><label for="rName" data-i18n="f_name"></label><input id="rName" autocomplete="name"></div>
    <div class="f"><label for="rCompany" data-i18n="f_company"></label><input id="rCompany" autocomplete="organization"></div>
    <div class="f"><label for="rEmail" data-i18n="f_email"></label><input id="rEmail" class="ltr" type="email" autocomplete="email"></div>
    <div class="f"><label for="rPhone" data-i18n="f_phone"></label><input id="rPhone" class="ltr" type="tel" autocomplete="tel"></div>
    <div class="f"><label for="rIntent" data-i18n="f_intent"></label>
      <select id="rIntent"><option value="Buy" data-i18n="opt_buy"></option><option value="Sell" data-i18n="opt_sell"></option></select></div>
    <div class="f"><label for="rGoods" data-i18n="f_goods"></label><input id="rGoods" list="goodsList" autocomplete="off">
      <datalist id="goodsList"><option value="Pistachio"><option value="Oil, gas & petrochemicals"><option value="Industrial products"><option value="Agriculture & food"><option value="Machinery & parts"><option value="Metals & raw materials"><option value="Consumer goods"></datalist></div>
    <div class="f"><label for="rQty" data-i18n="f_qtytxt"></label><input id="rQty" class="ltr" placeholder="e.g. 19 MT"></div>
    <div class="f"><label for="rPlace" data-i18n="f_place"></label><input id="rPlace" class="ltr" placeholder="e.g. Mersin, Turkey"></div>
    <div class="f full"><label for="rTerms" data-i18n="f_terms"></label><input id="rTerms" class="ltr" placeholder="e.g. CIF, T/T"></div>
    <div class="f full"><label for="rMsg" data-i18n="f_msg"></label><textarea id="rMsg"></textarea></div>
  </div>
  <div class="note" id="rErr" style="display:none"></div>
  <div style="margin-top:12px">
    <button class="btn wa" id="rWa" type="button" data-i18n="btn_wa"></button>
    <button class="btn navy" id="rMail" type="button" data-i18n="btn_mail"></button>
    <button class="btn tg" id="rTg" type="button" data-i18n="btn_tg"></button>
  </div>
  <p class="hint" data-i18n="contact_small"></p></div>
</section>

<!-- INVOICE -->
<section class="view" id="v-invoice">
  <h2 data-i18n="inv_h2"></h2>
  <div class="note" data-i18n="inv_note"></div>
  <div class="card"><div class="fgrid">
    <div class="f"><label for="iNo" data-i18n="i_no"></label><input id="iNo" class="ltr"></div>
    <div class="f"><label for="iDate" data-i18n="i_date"></label><input id="iDate" class="ltr" type="date"></div>
    <div class="f"><label for="iBuyer" data-i18n="i_buyer"></label><input id="iBuyer" class="ltr"></div>

/* ===================== HELPERS ===================== */
const $=id=>document.getElementById(id);
let lang="fa";
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;
const tname=p=>(lang!=="en"&&p[lang])?p.en+" — "+p[lang]:p.en;
function normDigits(s){return String(s==null?"":s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٬،,\s]/g,"").replace(/٫/g,".");}
const num=s=>{const n=parseFloat(normDigits(s));return isFinite(n)?n:0;};
function fmtField(el){let s=normDigits(el.value).replace(/[^0-9.\-]/g,"");const p=s.split(".");let o=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");if(p.length>1)o+="."+p.slice(1).join("");el.value=o;}
const f0=n=>(isFinite(n)?Math.round(n):0).toLocaleString("en-US");
const f2=n=>(isFinite(n)?n:0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const e=$("toast");e.textContent=msg;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1400);}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt));}
  fallbackCopy(txt);return Promise.resolve();
}
function fallbackCopy(txt){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(e){}a.remove();}
function gradeFactor(text){
  const d=(normDigits(text).match(/[1-3]/g)||["1"]);
  return d.reduce((s,x)=>s+GRADE_F[x],0)/d.length;
}
function refPrice(typeKey,size,gradeText,form){
  const ty=TYPES.find(x=>x.k===typeKey);
  const base=num(($("base_"+typeKey)||{}).value)||ty.ref;
  return base*SIZE[size]*gradeFactor(gradeText)+FORM_ADD[form];
}

/* ===================== CALCULATOR ===================== */
function model(){
  const rate=Math.max(num($("rate").value),1);
  const kg=Math.max(num($("cQty").value)*($("cQU").value==="ton"?1000:1),0);
  const qk=Math.max(kg,1e-9);
  const comm=Math.min(Math.max(num($("cComm").value),0),95)/100;
  const prof=num($("cProfit").value)/100;
  const adj=1+num($("cAdj").value)/100;
  const raw=num($("cPrice").value);
  const pkgT=($("cPU").value==="usd"?raw*rate:raw)*adj;
  const purchase=pkgT*kg;
  const it={};
  COSTROWS.forEach(r=>{
    if(r.id==="ins")return;
    const a=num($("cost_"+r.id).value),u=$("unit_"+r.id).value;
    it[r.id]=u==="usd_total"?a*rate:u==="usd_kg"?a*rate*kg:u==="tmn_total"?a:a*kg;
  });
  const payfee=purchase*num($("cPayfee").value)/100;
  const A=it.pack+it.other,B=it.inland+it.load,C=it.customs+it.port+payfee,D=it.freight;
  const EXW=purchase+A,FOB=EXW+B+C,CFR=FOB+D;
  const insv=CFR*num($("cost_ins").value)/100,CIF=CFR+insv;
  const costs={EXW,FOB,CFR,CIF},out={};
  TERMS.forEach(k=>{
    const cost=costs[k],price=cost*(1+prof)/(1-comm);
    out[k]={cost,price,comm:price*comm,profit:cost*prof,tmnKg:price/qk,usdKg:price/qk/rate,usdTon:price/qk/rate*1000,usdTot:price/rate};
  });
  return {rate,kg,qk,purchase,pkgT,out,costs};
}
function termLabel(){
  const k=$("cTerm").value,d=$("cDest").value.trim();
  return k+((k==="CFR"||k==="CIF")&&d?" "+d:"");
}
function renderCalc(){
  if(!$("cRes"))return;
  const M=model(),sel=$("cTerm").value,o=M.out[sel],rate=M.rate;
  const exp=o.cost-M.purchase;
  const kv=(k,v,v2,a)=>`<div class="kv${a?" acc":""}"><div class="k">${k}</div><div class="v">${v}</div>${v2?`<div class="v2">${v2}</div>`:""}</div>`;
  const tm=n=>f0(n)+" "+t("r_tmn"),us=n=>"$"+f2(n);
  $("cRes").innerHTML=`
   <div class="res"><div class="lab">${t("r_offer")} — ${esc(termLabel())}</div>
     <div class="price">${us(o.usdKg)}</div>
     <div class="row2"><span>${us(o.usdTon)} / ${t("r_tontxt")}</span><span>${f0(o.tmnKg)} ${t("r_tmn")}/${t("r_kg")}</span><span>${us(o.usdTot)} total</span></div></div>
   <div class="kvs">
     ${kv(t("r_pur_kg"),tm(M.pkgT),us(M.pkgT/rate))}
     ${kv(t("r_pur_tot"),tm(M.purchase),us(M.purchase/rate))}
     ${kv(t("r_exp"),tm(exp),us(exp/rate))}
     ${kv(t("r_cost_kg"),tm(o.cost/M.qk),us(o.cost/M.qk/rate))}
     ${kv(t("r_cost_tot"),tm(o.cost),us(o.cost/rate))}
     ${kv(t("r_comm"),tm(o.comm),us(o.comm/rate))}
     ${kv(t("r_profit"),tm(o.profit),us(o.profit/rate),true)}
     ${kv(t("r_total"),us(o.usdTot),tm(o.price),true)}
   </div>
   <h2>${t("r_by_term")}</h2>
   <div class="terms">${TERMS.map(k=>{const x=M.out[k];return `<div class="term${k===sel?" on":""}" data-term="${k}" role="button" tabindex="0">
      <b class="n">${k}</b><div class="p"><b>${us(x.usdKg)}/kg</b><small>${us(x.usdTon)}/MT · ${us(x.usdTot)}</small><small>${f0(x.tmnKg)} ${t("r_tmn")}/kg</small></div></div>`;}).join("")}</div>`;
  document.querySelectorAll("#cRes .term").forEach(el=>{
    const pick=()=>{$("cTerm").value=el.dataset.term;renderCalc();};
    el.onclick=pick;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}};
  });
  const ty=TYPES.find(x=>x.k===$("cType").value);
  $("cRefHint").textContent=ty?(t("btn_ref")+": "+f0(refPrice(ty.k,$("cSize").value,$("cGrade").value,$("cForm").value))+" "+t("r_tmn")+"/"+t("r_kg")):"";
}

  const k=$("cType").value;

  fmtField($("cPrice"));
  renderCalc();
}

/* ===================== PRICE BOARD ===================== */
let pForm="raw",pUnit="tkg";
const UNITS=[["tkg","Toman/kg"],["tton","Toman/MT"],["ukg","USD/kg"],["uton","USD/MT"]];
function chipSets(){
  const mk=(box,items,get,set)=>{box.innerHTML="";items.forEach(([v,l])=>{const b=document.createElement("button");b.type="button";b.className="chip"+(get()===v?" on":"");b.textContent=l;b.onclick=()=>{set(v);mk(box,items,get,set);renderPrices();};box.appendChild(b);});};
  mk($("pForms"),[["raw",t("form_raw")],["salt",t("form_salt")],["roast",t("form_roast")]],()=>pForm,v=>pForm=v);
  mk($("pUnits"),UNITS,()=>pUnit,v=>pUnit=v);
}
function showPrice(p,rate){
  switch(pUnit){
    case "tkg":return [f0(p)+" "+t("r_tmn"),"$"+f2(p/rate)];
    case "tton":return [f0(p*1000)+" "+t("r_tmn"),"$"+f0(p*1000/rate)];
    case "ukg":return ["$"+f2(p/rate),f0(p)+" "+t("r_tmn")+"/kg"];
    default:return ["$"+f0(p*1000/rate),f0(p*1000)+" "+t("r_tmn")+"/MT"];
  }
}
function renderPrices(){
  if(!$("pBoard"))return;
  const rate=Math.max(num($("rate").value),1);
  $("pBoard").innerHTML=TYPES.map(ty=>{
    const rows=Object.keys(SIZE).map(s=>{const [a,b]=showPrice(refPrice(ty.k,s,$("pGrade").value,pForm),rate);return `<tr><td>${s}</td><td class="n"><b>${a}</b><small>${b}</small></td></tr>`;}).join("");
    return `<div class="type"><h3><span>${esc(tname(ty))}</span><span style="font-weight:400;font-size:12px">${t("form_"+pForm)}</span></h3><table><tr><th>${t("l_size")}</th><th style="text-align:end">${t("l_price")}</th></tr>${rows}</table></div>`;
  }).join("");
}

  if(!$("iDate").value)$("iDate").value=iso;
  if(!$("iNo").value)$("iNo").value="MES-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-01";

function addMsg(text,who,acts){
  const d=document.createElement("div");d.className="msg "+who;d.textContent=text;
  if(acts&&acts.length){
    const box=document.createElement("div");box.className="acts";
    acts.forEach(a=>{const b=document.createElement("button");b.type="button";b.textContent=t("act_"+a);b.onclick=()=>doAct(a);box.appendChild(b);});
    d.appendChild(box);
  }
  $("chatMsgs").appendChild(d);$("chatMsgs").scrollTop=$("chatMsgs").scrollHeight;
}
function doAct(a){
  if(a==="wa"){window.open("https://wa.me/"+CFG.wa,"_blank");return;}
  if(a==="tg"){window.open("https://t.me/"+CFG.tg,"_blank");return;}
  $("chatBox").classList.remove("open");go(a);
}
function answerFor(text){
  const n=norm(text);let best=null,score=0;
  INTENTS.forEach(it=>{let s=0;(it.kw[lang]||[]).forEach(k=>{if(n.includes(norm(k)))s++;});if(s>score){score=s;best=it;}});
  return best?{text:best.ans[lang],acts:best.acts}:{text:t("chat_fallback"),acts:["wa","tg"]};
}
function userMsg(text){
  if(!text.trim())return;
  addMsg(text,"user");$("chatInput").value="";
  const a=answerFor(text);
  setTimeout(()=>addMsg(a.text,"bot",a.acts),250);
}
